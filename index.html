
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Groq AI Chatbot</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #0b1120;
    color: white;
    height: 100vh;
}

.app {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 250px;
    background: #111827;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 24px;
    color: #38bdf8;
    font-weight: bold;
    margin-bottom: 25px;
}

.new-chat {
    background: #0284c7;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.new-chat:hover {
    background: #0369a1;
}

.sidebar-info {
    margin-top: auto;
    color: #94a3b8;
    font-size: 13px;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 65px;
    background: #111827;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #334155;
    font-size: 19px;
    font-weight: bold;
}

.header span {
    color: #38bdf8;
}

.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.welcome {
    text-align: center;
    margin-top: 100px;
}

.welcome h1 {
    font-size: 35px;
    margin-bottom: 15px;
}

.welcome p {
    color: #94a3b8;
    margin: 8px;
}

.message {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    align-items: flex-start;
}

.avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #0284c7;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.message-content {
    background: #1e293b;
    padding: 14px 17px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    flex-direction: row-reverse;
}

.user .avatar {
    background: #7c3aed;
}

.user .message-content {
    background: #164e63;
}

.typing {
    color: #38bdf8;
}

.input-container {
    padding: 15px 20px;
}

.input-box {
    max-width: 850px;
    margin: auto;
    display: flex;
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 14px;
    padding: 8px;
}

.input-box input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    padding: 13px;
    color: white;
    font-size: 16px;
}

.input-box button {
    background: #0284c7;
    border: none;
    color: white;
    width: 45px;
    height: 45px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
}

.input-box button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.footer {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    margin-top: 12px;
}

@media(max-width:650px) {
    .sidebar {
        display: none;
    }

    .chat-box {
        padding: 15px;
    }

    .welcome h1 {
        font-size: 28px;
    }

    .message-content {
        max-width: 85%;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">🤖 My AI</div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <div class="sidebar-info">
            Powered by Groq AI<br>
            Version 1.0
        </div>
    </aside>

    <main class="main">

        <header class="header">
            <span>🤖 My Groq AI</span>
        </header>

        <div class="chat-box" id="chatBox">

            <div class="welcome" id="welcome">
                <h1>👋 Hello!</h1>
                <p>Welcome to My AI Chatbot</p>
                <p>Ask me anything you want.</p>
            </div>

        </div>

        <div class="input-container">

            <div class="input-box">

                <input
                    type="text"
                    id="userInput"
                    placeholder="Message My AI..."
                    autocomplete="off"
                >

                <button id="sendBtn" onclick="sendMessage()">
                    ➤
                </button>

            </div>

            <div class="footer">
                Powered by Groq API. AI can make mistakes.
            </div>

        </div>

    </main>

</div>

<script>

const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

let messages = [];
let busy = false;

function addMessage(text, role) {

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const row = document.createElement("div");
    row.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "👤" : "🤖";

    const content = document.createElement("div");
    content.className = "message-content";
    content.textContent = text;

    row.appendChild(avatar);
    row.appendChild(content);

    chatBox.appendChild(row);

    chatBox.scrollTop = chatBox.scrollHeight;

    return content;
}

async function sendMessage() {

    const text = userInput.value.trim();

    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;

    userInput.value = "";

    addMessage(text, "user");

    messages.push({
        role: "user",
        content: text
    });

    const typing = addMessage("AI is thinking...", "bot");
    typing.classList.add("typing");

    try {

        const response = await fetch("/api/chat", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                messages: messages
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "API error");
        }

        typing.textContent = data.reply;
        typing.classList.remove("typing");

        messages.push({
            role: "assistant",
            content: data.reply
        });

    } catch (error) {

        typing.textContent = "Error: " + error.message;
        typing.classList.remove("typing");

        // Failed request ko history se hata do.
        messages.pop();

    } finally {

        busy = false;
        sendBtn.disabled = false;
        userInput.focus();

        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

function newChat() {

    messages = [];

    chatBox.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>👋 Hello!</h1>
            <p>Welcome to My AI Chatbot</p>
            <p>Ask me anything you want.</p>
        </div>
    `;

    userInput.value = "";
}

userInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
