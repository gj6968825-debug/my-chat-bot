
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #0f172a;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.chat-container {
    width: 100%;
    max-width: 700px;
    height: 95vh;
    background: #1e293b;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #334155;
}

.header {
    padding: 20px;
    background: #111827;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h2 {
    color: #38bdf8;
}

.header button {
    background: #334155;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.chat-box {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.message {
    margin-bottom: 18px;
    display: flex;
}

.message p {
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 80%;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.user {
    justify-content: flex-end;
}

.user p {
    background: #0284c7;
}

.bot p {
    background: #334155;
}

.input-area {
    display: flex;
    padding: 15px;
    gap: 10px;
    background: #111827;
}

.input-area input {
    flex: 1;
    padding: 14px;
    border: none;
    outline: none;
    border-radius: 8px;
    background: #334155;
    color: white;
    font-size: 16px;
}

.input-area button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #0284c7;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

.input-area button:hover {
    background: #0369a1;
}

@media(max-width: 600px) {
    .chat-container {
        height: 100vh;
        border-radius: 0;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>🤖 My AI Chatbot</h2>
        <button onclick="newChat()">New Chat</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            <p>Hello! 👋 Main tumhara AI assistant hoon. Mujhse kuch bhi pucho!</p>
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
            onkeydown="if(event.key==='Enter') sendMessage()"
        >
        <button onclick="sendMessage()">Send ➤</button>
    </div>

</div>

<script>
function sendMessage() {

    let input = document.getElementById("userInput");
    let message = input.value.trim();

    if (message === "") return;

    let chatBox = document.getElementById("chatBox");

    // User message
    let userDiv = document.createElement("div");
    userDiv.className = "message user";

    let userP = document.createElement("p");
    userP.textContent = message;

    userDiv.appendChild(userP);
    chatBox.appendChild(userDiv);

    input.value = "";

    // Bot typing
    let botDiv = document.createElement("div");
    botDiv.className = "message bot";

    let botP = document.createElement("p");
    botP.textContent = "Typing...";

    botDiv.appendChild(botP);
    chatBox.appendChild(botDiv);

    chatBox.scrollTop = chatBox.scrollHeight;

    setTimeout(() => {
        botP.textContent = getReply(message);
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 1000);
}

function getReply(message) {

    let msg = message.toLowerCase();

    if (msg.includes("hello") || msg.includes("hi")) {
        return "Hello! 😊 Kaise ho?";
    }

    if (msg.includes("name")) {
        return "Mera naam My AI Chatbot hai!";
    }

    if (msg.includes("how are you")) {
        return "Main bilkul theek hoon! Tum kaise ho?";
    }

    if (msg.includes("help")) {
        return "Bilkul! Batao tumhe kis cheez mein help chahiye?";
    }

    if (msg.includes("bye")) {
        return "Goodbye! 👋 Phir milenge!";
    }

    return "Interesting question! 😊 Main abhi ek basic chatbot hoon. Real AI ke liye mujhe AI API se connect karna hoga.";
}

function newChat() {
    document.getElementById("chatBox").innerHTML = `
        <div class="message bot">
            <p>Hello! 👋 Main tumhara AI assistant hoon. Mujhse kuch bhi pucho!</p>
        </div>
    `;
}
</script>

</body>
</html>
